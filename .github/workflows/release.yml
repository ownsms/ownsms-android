name: Release APK

# Builds the minified release APK and attaches it to the GitHub Release.
# The app has no native libraries, so a single universal APK runs on every ABI
# (arm64-v8a, armeabi-v7a, x86, x86_64) — no per-architecture split needed.
on:
  release:
    types: [published]

permissions:
  contents: write # upload the APK as a release asset

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after the release tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ownsms-${{ github.event.release.tag_name }}.apk"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/ownsms-*.apk --clobber
